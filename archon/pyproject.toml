[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "archon"
version = "0.1.0"
description = "Glass-Box Trading Intelligence Platform - Multi-agent AI analysis built on OpenBB"
authors = ["Archon Team"]
readme = "README.md"
license = "MIT"
packages = [{ include = "archon", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
openbb = "^4.0.0"
anthropic = "^0.40.0"
openai = "^1.50.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
websockets = "^13.0"
rich = "^13.0.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"

[tool.poetry.scripts]
archon = "archon.cli:main"
archon-serve = "archon.cli:serve"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
